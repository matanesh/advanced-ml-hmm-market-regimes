name: QA export final PDF

on:
  push:
    branches:
      - qa/pdf-visual-artifact

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload final report PDF
        uses: actions/upload-artifact@v4
        with:
          name: final-polished-report
          path: reports/report.pdf
          if-no-files-found: error
