name: Package polished final submission

on:
  push:
    branches:
      - final/package-polished

permissions:
  contents: write

jobs:
  package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package final files
        run: |
          set -euo pipefail
          cp reports/report.pdf submission/HMM_Market_Regimes_Report_Matan_Eshel_203502802.pdf
          rm -f submission/HMM_Market_Regimes_Submission_Matan_Eshel_203502802.zip
          zip -j submission/HMM_Market_Regimes_Submission_Matan_Eshel_203502802.zip \
            submission/HMM_Market_Regimes_Report_Matan_Eshel_203502802.pdf \
            submission/HMM_Market_Regimes_Project_Matan_Eshel_203502802.ipynb \
            submission/README_SUBMISSION.md
          cmp reports/report.pdf submission/HMM_Market_Regimes_Report_Matan_Eshel_203502802.pdf
          test "$(unzip -Z1 submission/HMM_Market_Regimes_Submission_Matan_Eshel_203502802.zip | wc -l)" -eq 3
          pdfinfo submission/HMM_Market_Regimes_Report_Matan_Eshel_203502802.pdf | grep '^Pages:'
          unzip -l submission/HMM_Market_Regimes_Submission_Matan_Eshel_203502802.zip

      - name: Commit packaged submission
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add submission/HMM_Market_Regimes_Report_Matan_Eshel_203502802.pdf \
                  submission/HMM_Market_Regimes_Submission_Matan_Eshel_203502802.zip
          if git diff --cached --quiet; then
            echo "No packaging changes required"
          else
            git commit -m "Package polished final report for submission"
            git push origin HEAD:final/package-polished
          fi
